# =============================================================================
# config.yaml – business rules of the CLO / ABS monitoring prototype
# Every threshold, severity and key used by the controls is defined here.
# The code never hardcodes them.
# =============================================================================

# Reference date of the controls ("as of" date).
# null = latest ValuationDate found in positions.xlsx.
reference_date: null

# Upcoming cashflows: from the reference date to reference date + N days (inclusive).
cashflow_horizon_days: 30

# Format of a valid identifier (docs/data_spec.md): SYN + 9 digits, full match.
# A present ISIN that does not match is INVALID_VALUE and is treated like a
# missing ISIN (CLAUDE.md exception rule 1).
isin_pattern: '^SYN\d{9}$'

# Price movement thresholds, in % of the previous price (absolute movement).
# An alert is raised when |PriceChangePct| is STRICTLY GREATER than the threshold.
price_move_thresholds_pct:
  CLO Debt: 5.0
  ABS: 5.0
  CLO Equity: 15.0

# Sign of Amount per CashflowType (docs/data_spec.md): Coupon and Principal are
# inflows (> 0), Fee is an outflow (< 0). A wrong sign is INVALID_VALUE.
amount_sign:
  Coupon: positive
  Principal: positive
  Fee: negative

# Asset types for which a missing rating is an exception.
# CLO Equity is excluded: equity tranches are not rated.
rating_required_for: [CLO Debt, ABS]

# Allowed values for categorical columns.
allowed_values:
  AssetType: [CLO Debt, CLO Equity, ABS]
  Currency: [EUR, USD, GBP]
  CashflowType: [Coupon, Principal, Fee]
  Status: [Forecast, Confirmed, Paid]
  Portfolio: [CLO_EURO_01, CLO_GLOBAL_02, ABS_EUROPE_03, MULTI_USD_04]
  # An empty Rating is not checked here: it is handled by MISSING_RATING.
  Rating: [AAA, AA, A, BBB, BB, B, CCC]
  PriceSource: [Pricing Agent, Broker Quote, Evaluated Price]

# Required columns per input file. Missing columns stop processing.
required_columns:
  positions: [ValuationDate, Portfolio, ISIN, SecurityName, AssetType, Currency,
              Nominal, BookPrice, MarketPrice, Rating, MaturityDate]
  previous_prices: [ISIN, PreviousDate, PreviousPrice, PriceSource]
  cashflows: [Portfolio, ISIN, CashflowDate, CashflowType, Currency, Amount, Status]

# Keys
keys:
  position_unique: [ValuationDate, Portfolio, ISIN]
  cashflow_unique: [Portfolio, ISIN, CashflowDate, CashflowType, Amount]
  cashflow_to_position: [Portfolio, ISIN]
  previous_price_unique: [ISIN, PreviousDate]

# Data quality dimensions, in display order. Each control belongs to one.
# Plausibility = review alerts (e.g. large price moves), not necessarily data errors.
dimensions: [Completeness, Validity, Uniqueness, Consistency, Timeliness, Plausibility]

# Controls: on/off switch, severity (Critical | Warning | Information), label,
# dimension (one of the dimensions above).
controls:
  MISSING_ISIN:
    enabled: true
    severity: Critical
    label: Missing ISIN
    dimension: Completeness
  DUPLICATE_POSITION:
    enabled: true
    severity: Critical
    label: Duplicate position
    dimension: Uniqueness
  MISSING_MARKET_PRICE:
    enabled: true
    severity: Critical
    label: Missing market price
    dimension: Completeness
  INVALID_NOMINAL:
    enabled: true
    severity: Critical
    label: Zero or negative nominal
    dimension: Validity
  INVALID_PRICE:
    enabled: true
    severity: Critical
    label: Zero or negative price
    dimension: Validity
  MISSING_RATING:
    enabled: true
    severity: Warning
    label: Missing rating
    dimension: Completeness
  PRICE_MOVE_ABOVE_THRESHOLD:
    enabled: true
    severity: Warning
    label: Price movement above threshold
    dimension: Plausibility
  NO_PRICE_HISTORY:
    enabled: true
    severity: Information
    label: New security without price history
    dimension: Consistency
  DUPLICATE_PREVIOUS_PRICE:
    enabled: true
    severity: Warning
    label: Duplicate previous price
    dimension: Uniqueness
  UNMATCHED_CASHFLOW:
    enabled: true
    severity: Warning
    label: Cashflow without matching position
    dimension: Consistency
  DUPLICATE_CASHFLOW:
    enabled: true
    severity: Warning
    label: Duplicate cashflow
    dimension: Uniqueness
  PAST_FORECAST_CASHFLOW:
    enabled: true
    severity: Warning
    label: Past-dated cashflow still Forecast
    dimension: Timeliness
  CURRENCY_MISMATCH:
    enabled: true
    severity: Information
    label: Cashflow currency differs from position currency
    dimension: Consistency
  INVALID_VALUE:
    enabled: true
    severity: Warning
    label: Value outside allowed list or invalid date
    dimension: Validity
  MISSING_VALUE:
    enabled: true
    severity: Warning
    label: Other required value missing
    dimension: Completeness
